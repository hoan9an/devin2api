<!doctype html>
<html lang="en" class="boot-pending">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/web/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/web/favicon.ico">
  <link rel="apple-touch-icon" href="/web/apple-touch-icon.png">
  <link rel="manifest" href="/web/manifest.json">
  <meta name="theme-color" content="#141518">
  <title data-i18n="trend.title">Trends - Devin2API</title>
  <script src="/web/assets/js/theme-init.js?v=__VERSION__"></script>
  <link rel="stylesheet" href="/web/assets/css/styles.css?v=__VERSION__">
  <link rel="stylesheet" href="/web/assets/css/stats.css?v=__VERSION__">
  <link rel="stylesheet" href="/web/assets/css/filters.css?v=__VERSION__">
  <script defer src="/web/assets/js/i18n.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/lazy-echarts.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/template-engine.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/date-range-selector.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/filter-state.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/page-filters.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/web-auth.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/ui-api.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/ui-format.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/ui-filters.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/ui-notify.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/ui-topbar.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/ui-combobox.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/searchable-select.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/trend.js?v=__VERSION__"></script>
</head>
<body class="trend-page">
  <div class="app-container">
    <!-- 主内容区域 -->
    <main id="main" class="main-content">
      <div class="content-area">
        <h1 class="visually-hidden" data-i18n="nav.trend">Trends</h1>
        <div data-page-filters="trend"></div>

        <!-- 趋势图表 -->
        <section class="mb-8 trend-chart-section">
          <div class="card trend-chart-card">
            <!-- 控件与图例：单行排布 -->
            <div class="trend-chart-toolbar mb-6">
                <!-- 指标切换：9 个指标按量纲排序（请求/延迟/用量），收成一个下拉 -->
                <label class="trend-refresh-control trend-metric-control" for="f_trend_type">
                  <span class="trend-refresh-label" data-i18n="trend.metricType">Metric type</span>
                  <select id="f_trend_type" class="filter-select trend-refresh-select trend-metric-select">
                    <option value="count" data-i18n="trend.typeCount">Count</option>
                    <option value="rpm" data-i18n="trend.typeRpm">RPM</option>
                    <option value="error_rate" data-i18n="trend.typeErrorRate">Error Rate</option>
                    <option value="first_byte" data-i18n="trend.typeFirstByte" selected>TTFB</option>
                    <option value="duration" data-i18n="trend.typeDuration">Duration</option>
                    <option value="tokens" data-i18n="trend.typeTokens">Tokens</option>
                    <option value="tps" data-i18n="trend.typeTps">TPS</option>
                    <option value="cost" data-i18n="trend.typeCost">Cost</option>
                    <option value="cache_hit" data-i18n="trend.typeCacheHit">Cache</option>
                  </select>
                </label>
                <!-- 图表样式切换 -->
                <div
                  class="seg trend-chart-type-toggle"
                  id="trend-chart-type-group"
                  role="group"
                  data-i18n-aria-label="trend.chartType"
                  aria-label="Chart type"
                >
                  <button
                    class="seg-btn trend-chart-type-btn active"
                    type="button"
                    data-chart-type="line"
                    aria-pressed="true"
                    data-i18n="trend.lineChart"
                  >Line</button>
                  <button
                    class="seg-btn trend-chart-type-btn"
                    type="button"
                    data-chart-type="bar"
                    aria-pressed="false"
                    data-i18n="trend.barChart"
                  >Bar</button>
                </div>
                <!-- 模型序列筛选器 -->
                <div class="channel-filter-container">
                  <button class="btn btn-secondary btn-sm" id="btn-model-filter-toggle" type="button">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 5H3"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19H3"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 3v4"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 17v4"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12h-9"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 19h-5"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 5h-7"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10v4"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12H3"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 18H3"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 6H3"/>
                    </svg>
                    <span data-i18n="trend.modelFilter">Model Filter</span>
                  </button>
                  <div class="channel-filter-dropdown hidden" id="model-filter-dropdown">
                    <div class="filter-header">
                      <span data-i18n="trend.selectModels">Select Models</span>
                      <div class="filter-actions">
                        <button class="filter-action" id="btn-select-all-models" type="button" data-i18n="common.selectAll">Select all/Deselect all</button>
                        <button class="filter-action" id="btn-clear-all-models" type="button" data-i18n="common.clear">Clear</button>
                      </div>
                    </div>
                    <div class="filter-content" id="model-filter-list">
                      <!-- 动态生成模型列表 -->
                    </div>
                  </div>
                </div>
                <!-- 自动刷新开关与间隔：0=关闭，选择存 localStorage -->
                <label class="trend-refresh-control" for="f_refresh_interval">
                  <span class="trend-refresh-label" data-i18n="trend.refreshInterval">Auto refresh</span>
                  <select id="f_refresh_interval" class="filter-select trend-refresh-select">
                    <option value="0" data-i18n="trend.refreshOff">Off</option>
                    <option value="10" data-i18n="trend.refresh10s">10s</option>
                    <option value="30" data-i18n="trend.refresh30s">30s</option>
                    <option value="60" data-i18n="trend.refresh1min">1min</option>
                    <option value="300" data-i18n="trend.refresh5min">5min</option>
                  </select>
                </label>
                <!-- 数据分桶粒度（秒）：0=自动按时间窗分档，选择存 localStorage -->
                <label class="trend-refresh-control trend-bucket-control" for="f_bucket_sec">
                  <span class="trend-refresh-label" data-i18n="trend.bucketLabel">Interval</span>
                  <select id="f_bucket_sec" class="filter-select trend-refresh-select">
                    <option value="0" data-i18n="trend.bucketAuto">Auto</option>
                    <option value="10" data-i18n="trend.bucket10s">10 s</option>
                    <option value="30" data-i18n="trend.bucket30s">30 s</option>
                    <option value="60" data-i18n="trend.bucket1m">1 min</option>
                    <option value="300" data-i18n="trend.bucket5m">5 min</option>
                    <option value="600" data-i18n="trend.bucket10m">10 min</option>
                    <option value="1800" data-i18n="trend.bucket30m">30 min</option>
                    <option value="3600" data-i18n="trend.bucket1h">1 h</option>
                    <option value="7200" data-i18n="trend.bucket2h">2 h</option>
                    <option value="21600" data-i18n="trend.bucket6h">6 h</option>
                  </select>
                </label>
            </div>

            <!-- 图表容器 -->
            <div class="chart-container">
              <div class="chart-loading" id="chart-loading">
                <div class="loading-spinner"></div>
                <div data-i18n="trend.loading">Loading trend data...</div>
              </div>
              <div class="chart-error hidden" id="chart-error">
                <svg class="w-12 h-12 state-icon--error" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M12 9v4"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M12 17h.01"/>
                </svg>
                <div class="state-title state-title--error" data-i18n="trend.loadFailed">Load Failed</div>
                <div class="state-desc" data-i18n="trend.checkNetwork">Please check network connection or retry</div>
              </div>
              <!-- ECharts 容器 -->
              <div id="chart" class="w-full h-full hidden"></div>
            </div>

            <!-- 只读信息行：数据粒度与保温状态，不参与交互 -->
            <div class="trend-chart-footer">
              <span class="trend-meta-chip" id="bucket-interval" data-i18n="trend.dataIntervalInit">Interval: --</span>
              <span class="trend-meta-chip" id="warm-status-item" style="display:none">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>
                </svg>
                <span id="warm-status"></span>
              </span>
            </div>

          </div>
        </section>
      </div>
    </main>
  </div>


  <!-- 模型筛选项模板 -->
  <template id="tpl-model-filter-item">
    <div class="channel-filter-item">
      <div class="channel-checkbox {{checkedClass}}"></div>
      <div class="channel-color-indicator" style="background-color: {{color}}"></div>
      <div class="channel-name">{{displayName}}</div>
    </div>
  </template>

</body>
</html>
